name: windows-unit restored suites
on:
  push:
    branches: [windows-unit-filter-proof]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      # The #3142 branch, as the PR head.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Virgile-pct/mesh-llm
          ref: fix/windows-unit-crlf-filter
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-short-paths
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # The repository pins rustc-wrapper = "sccache"; local disk cache only.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Resolve Windows unit-test owners against the checked-out workspace
        id: windows_test_packages
        shell: bash
        env:
          SHARED_CRATES: '["skippy-model-artifact", "mesh-llm-host-runtime", "mesh-llm-skippy-adapter", "mesh-llm-control-api", "mesh-llm-membership", "mesh-llm-transport", "mesh-llm"]'
          WINDOWS_CRATES: '["mesh-llm-analytics", "mesh-llm-config", "mesh-llm-events", "mesh-llm-identity", "mesh-llm-payments", "mesh-llm-plugin", "mesh-llm-plugin-manager", "mesh-llm-routing", "mesh-llm-tui", "mesh-llm-ui", "mesh-llm-wallet", "process-supervision", "skippy-cache"]'
          WINDOWS_DYNAMIC_CRATES: '["mesh-llm-commands", "mesh-llm-system"]'
        run: |
          set -euo pipefail
          # Verbatim from the branch's ci-platform-checks-slice.yml.
          metadata_ok=0
          if cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/workspace-metadata.json"; then
            jq -r '.packages[].name' "$RUNNER_TEMP/workspace-metadata.json" | tr -d '\r' > "$RUNNER_TEMP/workspace-members.txt"
            metadata_ok=1
          else
            echo "::warning::cargo metadata failed; running the planned owners unchanged"
          fi
          filter_list() {
            local input="$1"
            if [[ "$metadata_ok" -ne 1 ]]; then
              printf '%s' "$input"
              return
            fi
            local -a requested=()
            mapfile -t requested < <(jq -r '.[]' <<<"$input" | tr -d '\r')
            local -a kept=()
            local crate
            for crate in "${requested[@]}"; do
              if grep -qxF -- "$crate" "$RUNNER_TEMP/workspace-members.txt"; then
                kept+=("$crate")
              else
                echo "::warning::platform plans $crate, which is not a workspace member of the checked-out revision; skipping it" >&2
              fi
            done
            jq -cn --args '$ARGS.positional' ${kept[@]+"${kept[@]}"}
          }
          {
            printf 'crates=%s\n' "$(filter_list "$SHARED_CRATES")"
            printf 'windows_crates=%s\n' "$(filter_list "$WINDOWS_CRATES")"
            printf 'windows_dynamic_crates=%s\n' "$(filter_list "$WINDOWS_DYNAMIC_CRATES")"
          } >> "$GITHUB_OUTPUT"
      - name: Run Windows unit tests
        shell: pwsh
        env:
          TEST_CRATES: ${{ steps.windows_test_packages.outputs.crates }}
          WINDOWS_TEST_CRATES: ${{ steps.windows_test_packages.outputs.windows_crates }}
          WINDOWS_DYNAMIC_TEST_CRATES: ${{ steps.windows_test_packages.outputs.windows_dynamic_crates }}
        run: |
          # Verbatim loop from the branch's "Run Windows unit tests", except that
          # a failing crate is recorded and the next one still runs, so one run
          # shows every suite.
          $failed = @()
          $crates = @($env:TEST_CRATES | ConvertFrom-Json) + @($env:WINDOWS_TEST_CRATES | ConvertFrom-Json)
          foreach ($crate in $crates) {
            Write-Host "::group::cargo test -p $crate"
            if ($crate -eq 'mesh-llm-skippy-adapter') {
              cargo test --locked -p $crate --lib --features mesh-llm-skippy-adapter/dynamic-native-runtime
            } else {
              cargo test --locked -p $crate --lib
            }
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            Write-Host "RESULT $crate exit=$code"
            if ($code -ne 0) { $failed += $crate }
          }
          foreach ($crate in @($env:WINDOWS_DYNAMIC_TEST_CRATES | ConvertFrom-Json)) {
            Write-Host "::group::cargo test -p $crate (dynamic runtime)"
            cargo test --locked -p $crate --lib --features mesh-llm-system/dynamic-native-runtime
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            Write-Host "RESULT $crate exit=$code"
            if ($code -ne 0) { $failed += $crate }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED: $($failed -join ', ')"
            exit 1
          }
          Write-Host "ALL PASSED"
